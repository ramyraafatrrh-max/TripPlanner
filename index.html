<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<meta name="description" content="Trip Pilot: turn your travel PDFs into a day-by-day plan with maps, progress tracking and morning alerts.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trip Pilot">
<title>Trip Pilot</title>
<link rel="preload" as="image" href="img/sky.jpg">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="home">

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs><linearGradient id="goldg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3dfab"/><stop offset="1" stop-color="#c9a15a"/></linearGradient></defs>
</svg>

<div id="scene" aria-hidden="true">
  <div class="bg"></div><div class="bg"></div>
  <div class="shade"></div>
  <div class="vignette"></div>
</div>

<!-- plane used for page transitions -->
<div id="flight" aria-hidden="true">
  <span class="trail"></span>
  <svg viewBox="0 0 64 64" width="44" height="44"><path d="M60 32 38 24 22 6h-6l8 18-14 4-6-6H0l4 10-4 10h4l6-6 14 4-8 18h6l16-18 22-8c3-1 3-4 0-6z" fill="url(#goldg)"/></svg>
</div>
<div id="wipe" aria-hidden="true"></div>

<div id="app" role="main"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="sheetHost"></div>
<noscript>Trip Pilot needs JavaScript. Please enable it.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
