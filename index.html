<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16335c">
<meta name="description" content="Trip Pilot: turn your travel PDFs into a day-by-day plan with maps, progress tracking and morning alerts.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trip Pilot">
<title>Trip Pilot</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- travel scene: sky, sun, drifting clouds, Mount Fuji and the sea -->
<div id="scene" aria-hidden="true">
  <div class="sky"></div>
  <div class="sun"></div>
  <svg class="cloud c1" viewBox="0 0 200 80"><path d="M30 60h140a30 30 0 0 0 4-59 40 40 0 0 0-76-6A34 34 0 0 0 30 60z" fill="#fff"/></svg>
  <svg class="cloud c2" viewBox="0 0 200 80"><path d="M30 60h140a30 30 0 0 0 4-59 40 40 0 0 0-76-6A34 34 0 0 0 30 60z" fill="#fff"/></svg>
  <svg class="cloud c3" viewBox="0 0 200 80"><path d="M30 60h140a30 30 0 0 0 4-59 40 40 0 0 0-76-6A34 34 0 0 0 30 60z" fill="#fff"/></svg>
  <svg class="cloud c4" viewBox="0 0 200 80"><path d="M30 60h140a30 30 0 0 0 4-59 40 40 0 0 0-76-6A34 34 0 0 0 30 60z" fill="#fff"/></svg>
  <svg class="mtn" viewBox="0 0 1440 420" preserveAspectRatio="xMidYMax slice">
    <defs>
      <linearGradient id="gFar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7f97c4"/><stop offset="1" stop-color="#a9b9db"/></linearGradient>
      <linearGradient id="gFuji" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f5c96"/><stop offset="1" stop-color="#6580b8"/></linearGradient>
      <linearGradient id="gNear" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f3f6e"/><stop offset="1" stop-color="#16335c"/></linearGradient>
    </defs>
    <path d="M0 300 L120 230 L230 290 L360 200 L500 290 L640 220 L780 300 L900 240 L1040 300 L1180 225 L1320 290 L1440 240 V420 H0Z" fill="url(#gFar)" opacity=".75"/>
    <path d="M330 420 L640 130 Q720 70 800 130 L1110 420Z" fill="url(#gFuji)"/>
    <path d="M590 178 Q640 128 680 112 Q720 95 760 112 Q800 128 850 178 Q820 160 790 176 Q770 150 745 172 Q720 150 700 176 Q675 156 650 178 Q620 160 590 178Z" fill="#f4f7ff"/>
    <path d="M0 360 Q160 300 320 350 T640 340 T960 355 T1280 330 T1440 350 V420 H0Z" fill="url(#gNear)"/>
    <g fill="#c8372d"><rect x="1120" y="318" width="6" height="42"/><rect x="1166" y="318" width="6" height="42"/><rect x="1108" y="312" width="76" height="8" rx="2"/><rect x="1114" y="326" width="64" height="5"/></g>
  </svg>
</div>

<!-- plane used for page transitions -->
<div id="flight" aria-hidden="true">
  <span class="trail"></span>
  <svg viewBox="0 0 64 64" width="46" height="46"><path d="M60 32 38 24 22 6h-6l8 18-14 4-6-6H0l4 10-4 10h4l6-6 14 4-8 18h6l16-18 22-8c3-1 3-4 0-6z" fill="#fff" stroke="#16335c" stroke-width="2" stroke-linejoin="round"/></svg>
</div>
<div id="wipe" aria-hidden="true"></div>

<div id="app" role="main"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="sheetHost"></div>

<noscript>Trip Pilot needs JavaScript. Please enable it.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
